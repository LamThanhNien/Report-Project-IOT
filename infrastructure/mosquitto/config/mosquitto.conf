# Development Mosquitto config – plaintext listener on 1883. In production, this file is not used; production uses mosquitto.prod.conf with TLS‑only listener.
listener 1883

# Load the mosquitto-go-auth plugin
plugin /mosquitto/go-auth.so

# Authentication & Authorization using HTTP Backend
auth_opt_backends http
auth_opt_http_host api
auth_opt_http_port 8000
auth_opt_http_method post
auth_opt_http_getuser_uri /api/v1/mqtt/auth
auth_opt_http_superuser_uri /api/v1/mqtt/superuser
auth_opt_http_aclcheck_uri /api/v1/mqtt/acl

# Disable local password and ACL files as requested
allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# Enable HTTP auth/ACL caching for 300 seconds
auth_opt_cache true
auth_opt_auth_cache_seconds 300
auth_opt_acl_cache_seconds 300

persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true

# Connection stability settings
max_keepalive 120
max_inflight_messages 50
max_queued_messages 500

