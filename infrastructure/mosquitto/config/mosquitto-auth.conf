# Mosquitto with username/password authentication (production example)
# To enable: replace mosquitto.conf with this file and create the password file.
#
# Step 1 — generate password file inside the mosquitto container:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd aifom-api
#   docker compose exec mosquitto mosquitto_passwd /mosquitto/config/passwd esp32-device
#
# Step 2 — update .env:
#   MQTT_USERNAME=aifom-api
#   MQTT_PASSWORD=<generated password>
#
# Step 3 — restart mosquitto with this config.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true
