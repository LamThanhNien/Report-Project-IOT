services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  mosquitto:
    image: iegomez/mosquitto-go-auth:latest
    restart: unless-stopped
    ports:
      - "${MQTT_HOST_PORT:-1884}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    environment:
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:?Set MQTT_ADMIN_USER in .env}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Set MQTT_ADMIN_PASSWORD in .env}
      MQTT_DEVICE_USER: ${MQTT_DEVICE_USER:?Set MQTT_DEVICE_USER in .env}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:?Set MQTT_DEVICE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -C 1 -t '$$SYS/broker/uptime' -u aifom-api -P $${MQTT_ADMIN_PASSWORD} -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  api:
    build: ../backend
    restart: unless-stopped
    working_dir: /workspace/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      API_HOST_PORT: ${API_HOST_PORT:-8000}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_HOST_PORT: ${MQTT_HOST_PORT:-1883}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      PYTHONPATH: /workspace/backend
      MDNS_HOST_IP: ${MDNS_HOST_IP:-}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ../:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  postgres_data:
  minio_data:
  mosquitto_data:
