sentence=Aifom edge client library for ESP32 supporting Blynk-style dynamic webhooks and virtual channel messaging.
paragraph=This library allows ESP32 devices running on Aifom to connect to the MQTT broker using dynamic auth tokens and interact via virtual channels, mimicking Blynk-style writes and reads with automatic ACKs.
