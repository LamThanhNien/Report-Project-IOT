[project]
name = "aifom-api"
version = "0.1.0"
description = "FastAPI backend scaffold for AIFOM"
requires-python = ">=3.11"
dependencies = [
  # FastAPI 0.137 switches included routers to lazy route objects that are not
  # yet compatible with the current Prometheus instrumentation middleware.
  "fastapi>=0.110,<0.137",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "email-validator>=2.0.0",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "paho-mqtt>=2.1",
  "minio>=7.2",
  "python-multipart>=0.0.9",
  "prometheus-fastapi-instrumentator>=0.9",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.0",
  "alembic>=1.13",
  "sse-starlette>=2.0",
  "slowapi>=0.1.9",
  "zeroconf>=0.131",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: integration tests",
]
